name: Signed Huawei Ads store candidate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: period-signed-huawei-release
  cancel-in-progress: false

jobs:
  signed-huawei:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-huawei-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Prepare JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Prepare Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Bootstrap Gradle wrapper
        run: gradle wrapper --gradle-version 8.13 --distribution-type bin
      - name: Verify signing secrets present
        env:
          STORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$STORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "Missing release signing secrets"
            exit 1
          fi
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/periodcalculator-release.jks"
          test -s "$RUNNER_TEMP/periodcalculator-release.jks"
      - name: Build production Huawei Ads APK (three languages)
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-build-cache --stacktrace :app:testOfflineDebugUnitTest :app:assembleHuaweiRelease \
            -PhuaweiBannerId=f8hj1hr021 \
            -PhuaweiInterstitialId=m80vtl2jek \
            -PenableAdRequests=true \
            -PreleaseStoreFile="$RUNNER_TEMP/periodcalculator-release.jks" \
            -PreleaseStorePassword="$STORE_PASSWORD" \
            -PreleaseKeyAlias=periodcalculator \
            -PreleaseKeyPassword="$STORE_PASSWORD"
      - name: Validate release signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/huawei/release/
          test -s app-huawei-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app-huawei-release.apk | tee signing-verify.txt
          grep -qi '5df6b02a6769c3c200472e391b939700dcb3b00d13749ca7e7d30ec989f9b634' signing-verify.txt
          sha256sum app-huawei-release.apk > SHA256SUMS.txt
      - name: Publish signed Huawei release (not debug)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v1.0.3"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite its signed APK"
            exit 1
          fi
          gh release create "$tag" \
            app/build/outputs/apk/huawei/release/app-huawei-release.apk \
            app/build/outputs/apk/huawei/release/SHA256SUMS.txt \
            --title "Period Calculator v1.0.2 — Huawei Ads" \
            --notes "Signed Huawei Ads build with banner f8hj1hr021 and interstitial m80vtl2jek. No user-facing ads on/off setting or generic opt-in prompt. Non-personalised ads are requested only after Huawei regional consent verification permits them; ads stay off where required consent is missing or status is unknown. This is a store candidate; validate on real devices before AppGallery submission."
      - name: Delete sensitive keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/periodcalculator-release.jks"
