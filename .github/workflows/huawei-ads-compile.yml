name: Huawei Ads flavor compile check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/huawei-ads-compile.yml'
      - 'app/build.gradle.kts'
      - 'app/src/huawei/**'
      - 'app/src/main/java/com/mhmmad/periodcalculator/ads/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  huawei-ads-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Prepare Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Bootstrap Gradle wrapper
        run: gradle wrapper --gradle-version 8.13 --distribution-type bin
      - name: Compile Huawei-flavor debug APK without requesting ads
        run: ./gradlew --stacktrace :app:assembleHuaweiDebug -PenableAdRequests=false
      - name: Check output exists
        run: test -s app/build/outputs/apk/huawei/debug/app-huawei-debug.apk
