name: Android CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Publish an explicitly labelled DEBUG pre-release APK'
        type: boolean
        default: false
      publish_signed_release:
        description: 'Build and publish signed STORE-CANDIDATE APK with repository Secrets'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: period-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 36 SDK from preinstalled commandline tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Prepare Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Bootstrap official Gradle wrapper
        run: gradle wrapper --gradle-version 8.13 --distribution-type bin
      - name: Validate official Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Test and build offline debug APK
        run: ./gradlew --stacktrace --warning-mode all :app:testOfflineDebugUnitTest :app:assembleOfflineDebug
      - name: Test APK exists
        run: test -s app/build/outputs/apk/offline/debug/app-offline-debug.apk
      - name: Publish debug PREVIEW to GitHub Releases
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_preview == true) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="preview-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" app/build/outputs/apk/offline/debug/app-offline-debug.apk \
            --title "DEBUG preview $tag (not store-ready)" --prerelease \
            --notes "Unsigned for store publication. Debug APK for testing only. This build has no Huawei ad SDK."
      - name: Restore signing keystore from GitHub Secrets
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_signed_release == true))
        env:
          STORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          KEY_ALIAS: periodcalculator
          KEY_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in STORE_BASE64 STORE_PASSWORD; do
            if [ -z "${!name}" ]; then echo "ERROR: missing signing secret $name"; exit 1; fi
          done
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
      - name: Build signed offline release APK
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_signed_release == true))
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          KEY_ALIAS: periodcalculator
          KEY_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        run: |
          ./gradlew --stacktrace :app:assembleOfflineRelease \
            -PreleaseStoreFile="$RUNNER_TEMP/release.jks" \
            -PreleaseStorePassword="$STORE_PASSWORD" \
            -PreleaseKeyAlias="$KEY_ALIAS" \
            -PreleaseKeyPassword="$KEY_PASSWORD"
          test -s app/build/outputs/apk/offline/release/app-offline-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/offline/release/app-offline-release.apk
          sha256sum app/build/outputs/apk/offline/release/app-offline-release.apk
      - name: Verify signed release APK
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_signed_release == true))
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/offline/release/app-offline-release.apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$apksigner"
          test -s "$apk"
          "$apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk" > app/build/outputs/apk/offline/release/SHA256SUMS.txt
      - name: Publish signed APK to GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_signed_release == true))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$(grep -m 1 'versionName = ' app/build.gradle.kts | cut -d '"' -f 2)"
            test -n "$version"
            tag="v${version}"
          fi
          gh release create "$tag" app/build/outputs/apk/offline/release/app-offline-release.apk app/build/outputs/apk/offline/release/SHA256SUMS.txt \
            --title "Period Calculator ${tag}" \
            --notes "Store-candidate APK signed with GitHub Secrets. Validate on real Huawei and AOSP devices before submission."
      - name: Remove keystore file
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
